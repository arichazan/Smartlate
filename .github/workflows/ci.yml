name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Check manifest and version consistency
        run: |
          node -e "
            const m = require('./extension/manifest.json');
            const p = require('./package.json');
            if (m.version !== p.version) { console.error('manifest ' + m.version + ' != package.json ' + p.version); process.exit(1); }
            if (!m.name.startsWith('Smartlate')) { console.error('unexpected name ' + m.name); process.exit(1); }
          "
          for f in extension/*.js extension/lib/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end tests (unpacked extension in Chromium)
        run: npm run test:e2e

      - name: Build and verify store package
        run: ./extension/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: smartlate-store-zip
          path: dist/*.zip
          if-no-files-found: error
